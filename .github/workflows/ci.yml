name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            scheme: ObservationTrackingExample
            destination: platform=macOS
          - platform: iOS
            scheme: ObservationTrackingExampleiOS
            destination: platform=iOS Simulator
    env:
      SCHEME: ${{ matrix.scheme }}
      DESTINATION: ${{ matrix.destination }}
    steps:
      - name: Check out the triggering commit
        # This public repository needs no credentials or checkout action dependency.
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Show toolchain
        run: xcodebuild -version
      - name: Select an installed iPhone simulator
        if: matrix.platform == 'iOS'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          runtimes = sorted(devices, key=lambda runtime: tuple(map(int, re.findall(r"\d+", runtime))), reverse=True)
          phones = [device for runtime in runtimes if ".iOS-" in runtime for device in devices[runtime] if device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"DESTINATION=platform=iOS Simulator,id={phones[0]['udid']}\n")
          PY
      - name: Build and run all tests
        run: |
          xcodebuild \
            -workspace ObservationTrackingExample.xcworkspace \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build test
